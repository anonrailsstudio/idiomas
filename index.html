<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Idiomas (Global)</title>

  <style>
    /* VARIABLES DE TEMA CLARO (PREDETERMINADO) */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --radius: 16px;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --card-hover-shadow: 0 12px 24px -4px rgba(79, 70, 229, 0.15);
      --locked-bg: #f1f5f9;
      --exam-bg: #eff6ff;
      --editor-text: #334155;
      --code-bg: #0f172a;
      --code-text: #f8fafc;
    }

    /* VARIABLES DE TEMA OSCURO (MODO NOCHE) */
    [data-theme="dark"] {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #34d399;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --card-hover-shadow: 0 12px 24px -4px rgba(99, 102, 241, 0.25);
      --locked-bg: #090d16;
      --exam-bg: #1e1b4b;
      --editor-text: #cbd5e1;
      --code-bg: #020617;
      --code-text: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem; 
      max-width: 900px; 
      margin: 0 auto; 
      min-height: 100vh; 
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .hidden { display: none !important; }

    /* HEADER & BOTÓN MODO NOCHE */
    header { 
      text-align: center; 
      margin-bottom: 2.5rem; 
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 1rem;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: var(--card-shadow);
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); }

    /* ANIMACIONES DE TRANSICIÓN */
    .screen { transition: opacity 0.3s ease, transform 0.3s ease; opacity: 1; transform: translateY(0) scale(1); }
    .screen-fade-out { opacity: 0; transform: translateY(15px) scale(0.98); pointer-events: none; }
    .screen-fade-in { animation: fadeInEntrance 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes fadeInEntrance {
      from { opacity: 0; transform: translateY(-15px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* PANTALLA INICIAL */
    .lang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
    .lang-card {
      background: var(--card-bg); 
      border: 2px solid var(--border); 
      border-radius: var(--radius);
      padding: 3rem 2rem; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.25s ease;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      box-shadow: var(--card-shadow);
    }
    .lang-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: var(--card-hover-shadow); }
    .flag-icon { font-size: 4.5rem; margin-bottom: 1rem; }

    /* VISTA DE CURSO */
    .top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 0.5rem; flex-wrap: wrap; }
    .btn-secondary {
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      padding: 0.6rem 1.2rem;
      border-radius: 8px; 
      font-weight: 600; 
      color: var(--text); 
      cursor: pointer; 
      transition: all 0.2s ease;
      display: inline-flex; 
      align-items: center; 
      gap: 0.5rem;
    }
    .btn-secondary:hover { background: var(--border); border-color: var(--text-muted); }

    .overall-progress { 
      background: var(--card-bg); 
      padding: 1.5rem; 
      border-radius: var(--radius); 
      border: 1px solid var(--border); 
      margin-bottom: 2rem; 
      box-shadow: var(--card-shadow);
    }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; }
    .progress-bar-bg { height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

    /* NIVELES Y TEMAS */
    .level-card { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      border: 1px solid var(--border); 
      margin-bottom: 2rem; 
      padding: 1.5rem; 
      box-shadow: var(--card-shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .level-card.locked { opacity: 0.5; background: var(--locked-bg); pointer-events: none; position: relative; }
    .level-card.locked::after {
      content: "🔒 Aprueba el examen anterior para desbloquear"; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95);
      color: white; padding: 0.8rem 1.2rem; border-radius: 8px; font-size: 0.85rem; pointer-events: auto;
      text-align: center; border: 1px solid var(--border);
    }

    .level-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; display: flex; justify-content: space-between; }
    .topic-list { display: flex; flex-direction: column; gap: 0.6rem; margin: 1.2rem 0; }
    .topic-item { 
      display: flex; 
      align-items: center; 
      padding: 0.8rem 1rem; 
      background: var(--bg); 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      transition: background-color 0.3s ease;
    }
    .topic-checkbox { width: 20px; height: 20px; accent-color: var(--success); cursor: pointer; margin-right: 1rem; }
    .topic-title-btn { background: none; border: none; color: var(--text); font-weight: 500; font-size: 0.95rem; text-align: left; cursor: pointer; flex-grow: 1; display: flex; justify-content: space-between; }
    .topic-title-btn:hover { color: var(--primary); }
    .topic-item.completed .topic-title-btn span { text-decoration: line-through; color: var(--text-muted); }

    /* EXAMEN */
    .exam-box { 
      margin-top: 1.5rem; 
      padding: 1rem; 
      background: var(--exam-bg); 
      border: 1.5px dashed var(--primary); 
      border-radius: 8px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      transition: background-color 0.3s ease;
    }
    .exam-btn { padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .exam-btn.passed { background: var(--success); cursor: default; }

    /* EDITOR / VISOR HTML */
    .topic-view-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; box-shadow: var(--card-shadow); }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .content-display { min-height: 250px; line-height: 1.7; font-size: 1.05rem; color: var(--editor-text); }
    .content-editor { 
      width: 100%; 
      min-height: 300px; 
      padding: 1rem; 
      border: 2px solid var(--primary); 
      border-radius: 8px; 
      font-size: 0.95rem; 
      font-family: monospace; 
      line-height: 1.5; 
      resize: vertical; 
      outline: none; 
      background-color: var(--code-bg);
      color: var(--code-text);
    }
  </style>
</head>

            💾 Guardar y Publicar para Todos

        </div>
      </div>
    </div>
  </div>

    /* MANEJO DEL MODO NOCHE / MODO CLARO */
    window.toggleTheme = function() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('lang_app_theme', newTheme);
      updateThemeUI(newTheme);
    };

    function updateThemeUI(theme) {
      const themeIcon = document.getElementById('theme-icon');
      const themeText = document.getElementById('theme-text');
      
      if (theme === 'dark') {
        themeIcon.innerText = '☀️';
        themeText.innerText = 'Modo Día';
      } else {
        themeIcon.innerText = '🌙';
        themeText.innerText = 'Modo Noche';
      }

              { id: "jp_n4_3", title: "3. Acciones Continuas (-te iru)" },
              { id: "jp_n4_4", title: "4. Forma Nai (Negativo Informal)" },
              { id: "jp_n4_5", title: "5. Dar y Recibir (Ageru, Kureru, Morai)" },
              { id: "jp_n4_6", title: "6. Expresar Posibilidad (Forma Potencial)" },
              { id: "jp_n4_7", title: "7. Expresar Razones (Kara, Node)" },
              { id: "jp_n4_8", title: "8. Intenciones (-to omou / -yoo)" },
              { id: "jp_n4_9", title: "9. Deber o Necesidad (-nakereba naranaim)" },
              { id: "jp_n4_10", title: "10. Comparaciones (Yori / Hou ga)" },
              { id: "jp_n4_11", title: "11. Kanji N4 Intermedios" },
              { id: "jp_n4_12", title: "12. Examen de Práctica N4" }
            ]
          }
        ]
      }
    };

    let activeLang = null;
    let activeTopic = null;
    let isEditing = false;

    let userState = JSON.parse(localStorage.getItem('lang_app_state')) || {
      completedTopics: [],
      passedExams: []
    };

    function saveData() {
      localStorage.setItem('lang_app_state', JSON.stringify(userState));
    }

    window.switchScreen = function(fromId, toId) {
      const fromEl = document.getElementById(fromId);
      const toEl = document.getElementById(toId);
      fromEl.classList.add('screen-fade-out');
      setTimeout(() => {
        fromEl.classList.add('hidden');
        fromEl.classList.remove('screen-fade-out');
        toEl.classList.remove('hidden');
        toEl.classList.add('screen-fade-in');
        setTimeout(() => toEl.classList.remove('screen-fade-in'), 350);
      }, 300);
    };

    window.openLanguage = function(langKey) {
      activeLang = langKey;
      renderCourse();
      switchScreen('selection-screen', 'course-screen');
    };

    window.toggleTopicCheck = function(topicId) {
      const idx = userState.completedTopics.indexOf(topicId);
      if (idx === -1) userState.completedTopics.push(topicId);
      else userState.completedTopics.splice(idx, 1);
      saveData();
      renderCourse();
    };

    window.passExam = function(levelId) {
      if (!userState.passedExams.includes(levelId)) {
        alert("🎉 ¡Felicidades! Has aprobado el examen y desbloqueado el siguiente nivel.");
        userState.passedExams.push(levelId);
        saveData();
        renderCourse();
      }
    };

    window.openTopicView = async function(topic) {
      activeTopic = topic;
      isEditing = false;

      document.getElementById('topic-view-title').innerText = topic.title;
      document.getElementById('edit-toggle-btn').innerText = "🔒 Editar Contenido";
      document.getElementById('editor-container').classList.add('hidden');
      document.getElementById('content-display').classList.remove('hidden');
      document.getElementById('content-display').innerHTML = "<i>⏳ Cargando lección desde la nube...</i>";

      switchScreen('course-screen', 'topic-screen');

      try {
        const docRef = doc(db, "topics", topic.id);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const content = docSnap.data().text;
          document.getElementById('content-display').innerHTML = content;
          document.getElementById('content-editor').value = content;
        } else {
          const defaultMsg = "<p style='color: var(--text-muted);'>Este tema aún no tiene contenido cargado. Entra a editar para agregar texto o HTML.</p>";
          document.getElementById('content-display').innerHTML = defaultMsg;
          document.getElementById('content-editor').value = "";
        }
      } catch (e) {
        console.error(e);
        document.getElementById('content-display').innerText = "Error al conectar con la base de datos.";
      }
    };

    window.handleEditAuth = function() {
      if (isEditing) {
        isEditing = false;
        document.getElementById('edit-toggle-btn').innerText = "🔒 Editar Contenido";
        document.getElementById('editor-container').classList.add('hidden');
        document.getElementById('content-display').classList.remove('hidden');
        return;
      }

      const inputCode = prompt("🔑 Ingresa el código secreto para editar:");
      if (inputCode === SECRET_CODE) {
        isEditing = true;
        document.getElementById('edit-toggle-btn').innerText = "❌ Cancelar Edición";
        document.getElementById('content-display').classList.add('hidden');
        document.getElementById('editor-container').classList.remove('hidden');
      } else if (inputCode !== null) {
        alert("❌ Código incorrecto.");
      }
    };

    window.saveTopicContentGlobal = async function() {
      const text = document.getElementById('content-editor').value;
      const saveBtn = document.getElementById('save-btn');

      saveBtn.innerText = "⏳ Guardando...";
      saveBtn.disabled = true;

      try {
        await setDoc(doc(db, "topics", activeTopic.id), {
          text: text,
          updatedAt: new Date()
        });

        document.getElementById('content-display').innerHTML = text;
        handleEditAuth();
        alert("🌐 ¡HTML renderizado y publicado con éxito!");
      } catch (e) {
        console.error(e);
        alert("❌ Ocurrió un error al guardar en la nube.");
      } finally {
        saveBtn.innerText = "💾 Guardar y Publicar para Todos";
        saveBtn.disabled = false;
      }
    };

    function renderCourse() {
      const langData = COURSE_DATA[activeLang];
      document.getElementById('current-lang-title').innerText = `Curso de ${langData.name}`;
      const container = document.getElementById('levels-container');
      container.innerHTML = '';

      let totalTopics = 0;
      let completedTopics = 0;

      langData.levels.forEach((level, index) => {
        const isUnlocked = (index === 0) || userState.passedExams.includes(langData.levels[index - 1].id);
        const examPassed = userState.passedExams.includes(level.id);
        let levelCompleted = 0;

        let topicsHTML = level.topics.map(topic => {
          totalTopics++;
          const isDone = userState.completedTopics.includes(topic.id);
          if (isDone) {
            completedTopics++;
            levelCompleted++;
          }

          return `
            <div class="topic-item ${isDone ? 'completed' : ''}">
              <input type="checkbox" 
                     class="topic-checkbox" 
                     ${isDone ? 'checked' : ''} 
                     onchange="toggleTopicCheck('${topic.id}')">
              <button class="topic-title-btn" onclick='openTopicView(${JSON.stringify(topic)})'>
                <span>${topic.title}</span>
                <span style="font-size: 0.8rem; opacity: 0.6;">➔</span>
              </button>
            </div>
          `;
        }).join('');

        const levelCard = document.createElement('div');
        levelCard.className = `level-card ${!isUnlocked ? 'locked' : ''}`;
        levelCard.innerHTML = `
          <div class="level-title">
            <span>${level.name}</span>
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">${levelCompleted}/${level.topics.length} lecciones</span>
          </div>
          <div class="topic-list">${topicsHTML}</div>
          <div class="exam-box">
            <div>
              <h4 style="color: var(--primary);">Examen de ${level.name}</h4>
              <p style="font-size: 0.8rem; color: var(--text-muted);">${examPassed ? '¡Nivel Aprobado!' : 'Pasa este examen para continuar al siguiente nivel.'}</p>
            </div>
            <button class="exam-btn ${examPassed ? 'passed' : ''}" onclick="passExam('${level.id}')" ${examPassed ? 'disabled' : ''}>
              ${examPassed ? 'Aprobado ✓' : 'Rendir Examen'}
            </button>
          </div>
        `;
        container.appendChild(levelCard);
      });

      const percent = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;
      document.getElementById('overall-percent').innerText = `${percent}%`;
      document.getElementById('overall-bar').style.width = `${percent}%`;
    }
  </script>
</body>
</html>
